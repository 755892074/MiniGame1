<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=750,initial-scale=0.5">
<title>Splash 面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F5F0E8;--gold:#EF9F27;--muted:#888780;--white:#FFF}
body{background:#222;display:flex;justify-content:center;padding:20px 0}
.phone{width:750px;height:1334px;background:var(--bg);border-radius:20px;overflow:hidden;position:relative;border:4px solid #444;display:flex;flex-direction:column;align-items:center}
.logo{width:300px;height:300px;margin-top:300px;border-radius:50%;background:linear-gradient(135deg,#E8D5C4,#C9A87C);display:flex;align-items:center;justify-content:center;font-size:64px}
.title{margin-top:40px;font-size:42px;font-weight:700;color:#2C2C2A;letter-spacing:4px}
.subtitle{margin-top:8px;font-size:18px;color:var(--muted);letter-spacing:2px}
.bar-bg{margin-top:60px;width:300px;height:8px;background:rgba(0,0,0,0.1);border-radius:4px;overflow:hidden}
.bar-fill{width:60%;height:100%;background:var(--gold);border-radius:4px}
.loading-text{margin-top:10px;font-size:14px;color:var(--muted)}
.version{position:absolute;bottom:16px;right:20px;font-size:11px;color:var(--muted);opacity:.5}
</style></head><body>
<div class="phone">
  <div class="logo">🐾</div>
  <div class="title">疯狂铲屎官</div>
  <div class="subtitle">Crazy Pooper</div>
  <div class="bar-bg"><div class="bar-fill"></div></div>
  <div class="loading-text">加载中...</div>
  <div class="version">v1.0.0</div>
</div>
</body></html>
