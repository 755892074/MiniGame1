<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=750,initial-scale=0.5">
<title>游戏界面 - 铲屎官疯了</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F5F0E8;--bar:rgba(30,30,36,0.85);--main:#E47A52;--sub:#7F77DD;
  --gold:#EF9F27;--dark:#2C2C2A;--muted:#888780;--white:#FFF;--card:#FFF;
  --pet-area:rgba(0,0,0,0.03);--bowl-bg:#FFF;
}
body{background:#222;display:flex;justify-content:center;padding:20px 0;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.phone{width:750px;height:1334px;background:var(--bg);border-radius:20px;overflow:hidden;position:relative;border:4px solid #444;display:flex;flex-direction:column}

/* ===== 顶部 HUD ===== */
.topbar{height:160px;background:var(--bar);display:flex;align-items:flex-end;padding:0 20px 16px;flex-shrink:0;gap:8px}
.tb-left{flex:0 0 30%;display:flex;flex-direction:column}
.tb-score{flex:1;display:flex;flex-direction:column;align-items:center}
.tb-right{flex:0 0 30%;display:flex;flex-direction:column;align-items:flex-end}
.tb-level{font-size:18px;color:#ddd;font-weight:600}
.tb-score-text{font-size:22px;color:var(--gold);font-weight:700}
.tb-step{font-size:16px;color:#aaa}
.tb-title{font-size:15px;color:var(--gold);font-weight:600}
.tb-fish{font-size:15px;color:#FFD700}
.tb-exp{font-size:12px;color:#999}

/* ===== 宠物排队区 ===== */
.pet-area{height:190px;display:flex;justify-content:center;align-items:center;gap:30px;flex-shrink:0;padding-top:10px}
.pet-card{display:flex;flex-direction:column;align-items:center;gap:4px}
.pet-face{width:110px;height:110px;border-radius:50%;background:#FFF;display:flex;align-items:center;justify-content:center;font-size:64px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.pet-label{font-size:14px;color:var(--dark);font-weight:600}

/* ===== 碗区域 ===== */
.bowl-area{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:20px;padding:10px 30px}
.bowl{width:140px;height:170px;background:var(--bowl-bg);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px;gap:3px;box-shadow:0 2px 6px rgba(0,0,0,0.08);border:1px solid rgba(0,0,0,0.05)}
.food{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}

/* ===== 底部工具栏 ===== */
.toolbar{height:120px;display:flex;justify-content:center;align-items:center;gap:12px;padding:0 30px;flex-shrink:0;padding-bottom:20px}
.tool-btn{width:90px;height:90px;border-radius:14px;background:linear-gradient(135deg,#8B83E5,#534AB7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tool-icon{font-size:28px}
.tool-text{font-size:13px;color:white;font-weight:600}
.tool-count{position:absolute;top:-4px;right:-4px;width:24px;height:24px;border-radius:50%;background:var(--main);color:white;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}

/* ===== 提示按钮 ===== */
.hint-btn{position:absolute;bottom:160px;right:30px;width:100px;height:50px;border-radius:25px;background:linear-gradient(135deg,#8B83E5,#534AB7);display:flex;align-items:center;justify-content:center;color:white;font-size:16px;font-weight:600;gap:4px}

/* ===== 设计标注（审查用） ===== */
.toolbar-btn{position:fixed;top:10px;left:10px;z-index:999;padding:6px 12px;border:1px solid #555;background:#333;color:white;border-radius:4px;cursor:pointer;font-size:12px}
</style></head><body>

<button class="toolbar-btn" onclick="document.body.style.background=document.body.style.background==='#222'?'#000':'#222'">切换背景</button>

<div class="phone">
  
  <!-- 顶部 HUD -->
  <div class="topbar">
    <div class="tb-left">
      <span class="tb-level">第1关</span>
    </div>
    <div class="tb-score">
      <span class="tb-score-text">得分: 0/110</span>
      <span class="tb-step">步数: 0</span>
    </div>
    <div class="tb-right">
      <span class="tb-title">高级铲屎官</span>
      <span class="tb-fish">🪙150  🐟1210</span>
      <span class="tb-exp">下一级: 10</span>
    </div>
  </div>

  <!-- 宠物排队区 -->
  <div class="pet-area">
    <div class="pet-card">
      <div class="pet-face">🐱</div>
      <span class="pet-label">橘猫</span>
    </div>
    <div class="pet-card">
      <div class="pet-face">🐶</div>
      <span class="pet-label">柴犬</span>
    </div>
  </div>

  <!-- 碗区域 -->
  <div class="bowl-area">
    <div class="bowl">
      <div class="food" style="background:#FFD4A0">🐟</div>
      <div class="food" style="background:#FFD4A0">🐟</div>
      <div class="food" style="background:#FFD4A0">🐟</div>
    </div>
    <div class="bowl">
      <div class="food" style="background:#C8E6C9">🌻</div>
    </div>
    <div class="bowl">
      <div class="food" style="background:#D4B896">🦴</div>
      <div class="food" style="background:#D4B896">🦴</div>
    </div>
    <div class="bowl">
      <div class="food" style="background:#FFD4A0">🐟</div>
    </div>
  </div>

  <!-- 提示按钮 -->
  <div class="hint-btn">💡 提示</div>

  <!-- 底部工具栏 -->
  <div class="toolbar">
    <div class="tool-btn">
      <span class="tool-icon">↩</span>
      <span class="tool-text">撤回</span>
      <span class="tool-count">3</span>
    </div>
    <div class="tool-btn">
      <span class="tool-icon">🥣</span>
      <span class="tool-text">加碗</span>
      <span class="tool-count">2</span>
    </div>
    <div class="tool-btn">
      <span class="tool-icon">🔀</span>
      <span class="tool-text">打乱</span>
      <span class="tool-count">3</span>
    </div>
    <div class="tool-btn">
      <span class="tool-icon">🔄</span>
      <span class="tool-text">重来</span>
    </div>
  </div>

</div>
</body></html>
